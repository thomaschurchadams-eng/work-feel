<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Three operating-control paths</title>
  <desc id="desc">Editorial illustration of three unlabelled control paths leading to a shared governance table; not an NCUA document or an actual credit-union system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1f3b"/><stop offset="1" stop-color="#173f5f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="100" r="170" fill="#e5b45d" opacity=".14"/>
  <path d="M0 510 C240 430 390 570 610 500 C825 430 970 450 1200 370 V630 H0Z" fill="#f3ead8" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="140" y="105" width="250" height="285" rx="24" fill="#f7f1e7"/>
    <rect x="475" y="105" width="250" height="285" rx="24" fill="#f7f1e7"/>
    <rect x="810" y="105" width="250" height="285" rx="24" fill="#f7f1e7"/>
  </g>
  <g fill="none" stroke="#a0454e" stroke-width="18" stroke-linecap="round">
    <path d="M205 190h120M205 245h82M205 300h145"/>
    <path d="M540 190h120M540 245h145M540 300h95"/>
    <path d="M875 190h120M875 245h82M875 300h145"/>
  </g>
  <g fill="#e5b45d">
    <circle cx="265" cy="430" r="28"/><circle cx="600" cy="430" r="28"/><circle cx="935" cy="430" r="28"/>
  </g>
  <g fill="none" stroke="#e5b45d" stroke-width="10">
    <path d="M265 458v55h335v-55"/><path d="M935 458v55H600"/>
  </g>
  <rect x="455" y="505" width="290" height="76" rx="20" fill="#a0454e"/>
  <g fill="#f7f1e7"><circle cx="530" cy="543" r="12"/><circle cx="600" cy="543" r="12"/><circle cx="670" cy="543" r="12"/></g>
