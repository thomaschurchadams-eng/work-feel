<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Mortgage appraisal threshold control</title><desc id="desc">Editorial illustration of a mortgage file passing through a 35,500-dollar threshold control.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b2d"/><stop offset="1" stop-color="#17465a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".25"/></filter></defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="1030" cy="85" r="160" fill="#22d3a7" opacity=".09"/><text x="70" y="88" fill="#9be7d4" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">2027 MORTGAGE CONTROL</text><text x="70" y="148" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Update the threshold.</text><text x="70" y="200" fill="#cfe8ef" font-family="Arial,sans-serif" font-size="30">Keep the appraisal framework intact.</text><g transform="translate(75 250)" filter="url(#s)"><rect width="500" height="285" rx="30" fill="#fff"/><path d="M80 75h240l90 90v70H80z" fill="#e9f4f7"/><path d="M320 75v90h90" fill="none" stroke="#2a6080" stroke-width="10"/><path d="M125 160h150M125 200h210" stroke="#7fa7b5" stroke-width="10" stroke-linecap="round"/><circle cx="405" cy="215" r="38" fill="#1da88d"/><path d="m387 215 13 13 24-29" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(625 250)" filter="url(#s)"><rect width="500" height="285" rx="30" fill="#f7fbfc"/><text x="45" y="70" fill="#14384a" font-family="Arial,sans-serif" font-size="22" font-weight="700">SMALL-LOAN EXEMPTION</text><text x="45" y="155" fill="#0b1f3b" font-family="Arial,sans-serif" font-size="64" font-weight="800">$35,500</text><path d="M45 195h410" stroke="#b4d1d8" stroke-width="4"/><text x="45" y="240" fill="#527282" font-family="Arial,sans-serif" font-size="22">Effective January 1, 2027</text></g></svg>