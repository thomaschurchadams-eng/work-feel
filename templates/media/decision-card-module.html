<!-- Separate practical editorial module. Claims and recommendations need public evidence. -->
<aside class="cuai-media-module" aria-labelledby="{{ASSET_ID}}-title" style="max-width:960px;margin:2rem auto;padding:1rem;border-left:4px solid #1b756f;box-sizing:border-box;overflow-wrap:anywhere">
  <p>Decision card · <time datetime="{{PUBLISHED_DATE}}">{{DISPLAY_DATE}}</time></p>
  <h2 id="{{ASSET_ID}}-title" class="section-title">{{TITLE}}</h2>
  <p><strong>Decision:</strong> {{DECISION}}</p><p><strong>Evidence:</strong> {{EVIDENCE}}</p><p><strong>Check:</strong> {{CHECK_AND_ACCOUNTABLE_OWNER}}</p><p><strong>Limits:</strong> {{UNCERTAINTY_AND_LIMITATIONS}}</p>
  <p>Source: <a href="{{SOURCE_URL}}">{{SOURCE_LABEL}}</a>. {{RIGHTS_CREDIT}}</p>
</aside>
