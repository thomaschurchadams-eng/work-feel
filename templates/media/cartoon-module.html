<!-- Separate editorial module; never replace the text-free article hero. -->
<figure class="cuai-media-module" aria-labelledby="{{ASSET_ID}}-caption" style="max-width:960px;margin:2rem auto;padding:1rem;box-sizing:border-box">
  <p>Editorial cartoon · <time datetime="{{PUBLISHED_DATE}}">{{DISPLAY_DATE}}</time></p>
  <img src="{{IMAGE_URL}}" alt="{{ALT_TEXT}}" width="1200" height="630" loading="lazy" style="display:block;max-width:100%;height:auto">
  <figcaption id="{{ASSET_ID}}-caption"><strong>{{TITLE}}</strong><p>{{EDITORIAL_INTERPRETATION}}</p><p>{{TEXT_ALTERNATIVE}}</p><p>Context: <a href="{{SOURCE_URL}}">{{SOURCE_LABEL}}</a>. Illustration: {{RIGHTS_CREDIT}}.</p></figcaption>
</figure>
