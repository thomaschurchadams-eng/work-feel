name: CUAI verified operations
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'automation/daily-cycle-state.json'
      - 'automation/agent-system/CUAI_AGENT_PROTOCOL.md'
      - 'automation/scheduled-tasks/**'
      - 'automation/native-video-handoff.md'
      - 'lib/operational-policy.cjs'
      - 'lib/media-slots.cjs'
      - 'lib/browser-readiness.cjs'
      - 'lib/daily-cycle-guards.cjs'
      - 'lib/publisher-write-plan.cjs'
      - 'scripts/validate-publisher-review.mjs'
      - 'lib/publisher-validation.cjs'
      - 'lib/design-review-routes.cjs'
      - 'scripts/check-operational-policy.cjs'
      - 'scripts/select-media-slot.cjs'
      - 'scripts/test-linkedin-selection-policy.mjs'
      - 'scripts/publisher-browser-preflight.cjs'
      - '**.html'
      - 'assets/styles.css'
      - 'assets/app.js'
      - 'templates/**'
      - 'scripts/*design*.mjs'
      - 'scripts/validate-daily-cycle-preservation.mjs'
      - 'scripts/validate-daily-cycle-chain.mjs'
      - 'scripts/generate-topic-hubs.mjs'
      - 'scripts/remediate-site-qc.mjs'
      - 'tests/*.test.cjs'
      - 'tests/design/**'
      - 'package*.json'
      - '.github/workflows/cuai-operations.yml'
  workflow_dispatch:
  schedule:
    # Post-slot reconciliation sweep. 17:45 UTC is after the latest approved
    # 12:30 p.m. ET company-page slot year-round, including DST transitions.
    - cron: '45 17 * * 1-5'
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('cuai-design-{0}', github.event.pull_request.number) || 'cuai-production-operations' }}
  cancel-in-progress: false
jobs:
  design-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Read exact review revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Trust the exact checkout inside the isolated container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate daily-cycle history against PR base and refreshed main
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          test "$EVENT_BASE_REF" = main
          CANONICAL_BASE_SHA=$(git rev-parse refs/remotes/origin/main)
          node scripts/validate-publisher-review.mjs "$EVENT_BASE_SHA" "$(git rev-parse HEAD)" "$CANONICAL_BASE_SHA"
          printf 'CUAI_DESIGN_BASE_REF=%s\n' "$CANONICAL_BASE_SHA" >> "$GITHUB_ENV"
      - name: Isolate the test browser cache for this job
        run: printf '%s\n' "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/cuai-design-browsers" >> "$GITHUB_ENV"
      - name: Use Node for design checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned free test dependencies
        run: npm ci
      - name: Install test browser
        run: npx playwright-core install chromium
      - name: Prove actual browser launch before acceptance
        run: npm run check:browser
      - name: Check canonical shell and existing regressions
        run: |
          node scripts/check-operational-policy.cjs daily-publisher
          node scripts/check-operational-policy.cjs cuai-operating-system
          node scripts/check-operational-policy.cjs cuai-media-coordinator
          npm run check:design
          npm test
      - name: Check rendered interactions, typography and accessibility
        run: npm run test:design
      - name: Preserve exact revision and review evidence
        if: always()
        run: |
          mkdir -p design-results
          git rev-parse HEAD > design-results/revision.txt
      - name: Upload review screenshots and checks
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cuai-design-review-${{ github.event.pull_request.head.sha }}
          path: design-results/
          if-no-files-found: warn
          retention-days: 14
  operate:
    if: >-
      github.repository == 'thomaschurchadams-eng/work-feel' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      id-token: write
    env:
      DEPLOYED_SHA: ${{ github.sha }}
    steps:
      - name: Read the deployed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.DEPLOYED_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate daily-cycle history from accepted baseline and pre-push main
        env:
          CUAI_PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/validate-daily-cycle-chain.mjs
      - name: Validate durable daily-cycle state
        run: node --test tests/daily-cycle-state.test.cjs
      - name: Verify authorization and process bounded operations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-secure-operations.cjs
      - name: Preserve outcome receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cuai-operation-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: operation-receipts/
          if-no-files-found: ignore
          retention-days: 14
