name: Reliability Branch Test

on:
  push:
    branches:
      - reliability/report-only-production-drift

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/operations-auth.test.cjs
      - run: git diff --check
